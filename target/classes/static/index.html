<!DOCTYPE html>
<html>
<head>
    <title>Create Product</title>

    <style>
        body {
            background-image: url('/images/background.jpg'); /* path relative to static */
            background-size: cover;    /* cover the whole page */
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Optional: form styling to see it better */
        #productForm {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            width: 400px;
            margin: 50px auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h2>Create Product</h2>

<form id="productForm" onsubmit="return false;">
    <label>Name:</label>
    <input type="text" id="name"><br><br>

    <label>Category:</label>
    <input type="text" id="category"><br><br>

    <label>Model:</label>
    <input type="text" id="model"><br><br>

    <label>Description:</label>
    <input type="text" id="description"><br><br>

    <button type="button" id="createBtn">Create</button>
</form>

<p id="response"></p>

<script>
    document.getElementById("createBtn").addEventListener("click", function() {

        const data = {
            name: document.getElementById("name").value,
            category: document.getElementById("category").value,
            model: document.getElementById("model").value,
            description: document.getElementById("description").value
        };

        fetch("http://localhost:8080/api/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(r => r.json())
        .then(res => {
            console.log(res);
            document.getElementById("response").innerHTML =
                "Created Product ID: " + res.id;
        })
        .catch(err => {
            document.getElementById("response").innerHTML =
                "Error: " + err;
        });

    });
</script>

</body>
</html>
