<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>
    <style>
        body {
            background-image: url('/images/background.jpg');
            background-size: cover;
            font-family: Arial;
        }

        h2 { text-align: center; }

        .box, .card {
            background: rgba(255,255,255,0.95);
            padding: 15px;
            width: 400px;
            margin: 20px auto;
            border-radius: 10px;
        }

        .card {
            box-shadow: 0 0 8px #aaa;
        }


        button {
            padding: 8px;
            width: 100%;
            margin-top: 5px;
            cursor: pointer;
        }

        /* ===== Loader ===== */
        #loader {
            display: none;
            border: 6px solid #f3f3f3;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Toast ===== */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background: #333;
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes fadeout {
            from {opacity: 1;}
            to {opacity: 0;}
        }
    </style>
</head>
</head>

<body>

<h2>Product List</h2>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Model</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    fetch("/api/products")
        .then(res => res.json())
        .then(products => {
            const body = document.getElementById("tableBody");
            products.forEach(p => {
                body.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.category}</td>
                        <td>${p.model}</td>
                        <td>${p.description}</td>
                    </tr>
                `;
            });
        });

     function editProduct(id) {
          const newName = prompt("Enter new product name");
          if (!newName) return;

          showLoader();

          fetch(`/api/products/${id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name: newName })
          })
          .then(() => {
              hideLoader();
              showToast("✏️ Product updated");
              loadProducts();
          });
      }
</script>

</body>
</html>
